# Generates the shared attestor sidecar gRPC bindings.
version: v2
plugins:
  - local: protoc-gen-go
    out: attestor/types
    opt:
      - paths=source_relative
      - Mattestor/attestor.proto=attestor/types/attestor
  - local: protoc-gen-go-grpc
    out: attestor/types
    opt:
      - paths=source_relative
      - Mattestor/attestor.proto=attestor/types/attestor
inputs:
  - directory: proto
    paths:
      - proto/attestor
